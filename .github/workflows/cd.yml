name: PySpark CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: [self-hosted, windows, x64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Python 3.11 virtual environment
        shell: pwsh
        run: |
          py -3.11 --version
          py -3.11 -m venv .venv

      - name: Install dependencies
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt

      - name: Verify Python and PySpark
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe --version
          .\.venv\Scripts\python.exe -c "import pyspark; print('PySpark:', pyspark.__version__)"

      - name: Run tests
        shell: pwsh
        run: |
          $env:PYSPARK_PYTHON = "$PWD\.venv\Scripts\python.exe"
          $env:PYSPARK_DRIVER_PYTHON = "$PWD\.venv\Scripts\python.exe"

          .\.venv\Scripts\python.exe -m pytest

      - name: Run deployment
        shell: pwsh
        run: .\deploy.ps1
